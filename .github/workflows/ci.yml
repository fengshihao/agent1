name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  java-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Weizhi source
        env:
          WEIZHI_GIT_URL: ${{ secrets.WEIZHI_GIT_URL }}
          WEIZHI_SKIP_SYNC: ${{ vars.WEIZHI_SKIP_SYNC }}
        run: chmod +x ./sync-weizhi.sh && ./sync-weizhi.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run tests (Weizhi optional)
        run: |
          set -euo pipefail
          WEIZHI_DIR="${GITHUB_WORKSPACE}/weizhi"
          if [ ! -d "${WEIZHI_DIR}/android" ] && [ -d "${GITHUB_WORKSPACE}/../weizhi/android" ]; then
            WEIZHI_DIR="${GITHUB_WORKSPACE}/../weizhi"
          fi
          if [ -d "${WEIZHI_DIR}" ] && [ -f "${WEIZHI_DIR}/scripts/test.sh" ]; then
            (cd "${WEIZHI_DIR}" && WEIZHI_SKIP_ASAN=1 ./scripts/test.sh)
            AGENT1_WEIZHI_REPO="${WEIZHI_DIR}" E2E_DEEPSEEK_V6_SKIP_LLM=1 ./scripts/e2e-deepseek-v6.sh
          else
            if [ "${GITHUB_REF_NAME}" = "master" ] || [ "${GITHUB_REF_NAME}" = "main" ]; then
              echo "::error::weizhi 未同步（${WEIZHI_DIR} 缺失）。master 分支不允许静默降级；请检查 sync-weizhi.sh 或 WEIZHI_SKIP_SYNC 变量。" >&2
              exit 1
            fi
            echo "::warning::skip weizhi（PR 分支降级）：未 clone weizhi — 跑 :core:test + :cli:test，桥集成测试被跳过"
            ./java_agent/gradlew --no-daemon -p java_agent :core:test :cli:test
          fi

  quality-static:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Java PMD + SpotBugs
        run: ./check-java-agent-static.sh

      - name: Android layering + main-thread gateway
        run: ./check-android-agent-static.sh

  android-assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Weizhi source
        env:
          WEIZHI_GIT_URL: ${{ secrets.WEIZHI_GIT_URL }}
          WEIZHI_SKIP_SYNC: ${{ vars.WEIZHI_SKIP_SYNC }}
        run: chmod +x ./sync-weizhi.sh && ./sync-weizhi.sh

      # 默认源码联编。备选预编译：Repository Variable WEIZHI_USE_PREBUILT=true + Secret WEIZHI_PREBUILT_URL（勿在 if 里引用 secret）
      - name: Import Weizhi prebuilt Maven (fallback)
        if: ${{ vars.WEIZHI_USE_PREBUILT == 'true' }}
        env:
          WEIZHI_PREBUILT_URL: ${{ secrets.WEIZHI_PREBUILT_URL }}
          WEIZHI_GITHUB_TOKEN: ${{ secrets.WEIZHI_GITHUB_TOKEN }}
        run: |
          if [ -z "${WEIZHI_PREBUILT_URL:-}" ]; then
            echo "WEIZHI_USE_PREBUILT=true 但未配置 WEIZHI_PREBUILT_URL，跳过预编译导入"
            exit 0
          fi
          chmod +x ./import-weizhi-prebuilt.sh && ./import-weizhi-prebuilt.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: chmod +x ./scripts/ci/install-android-sdk.sh && ./scripts/ci/install-android-sdk.sh

      - name: Build libweizhijni.so
        run: |
          if [ ! -d weizhi/android ]; then
            echo "未联编 weizhi 源码，跳过 native"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build
          chmod +x weizhi/scripts/build-android.sh weizhi/scripts/fetch-deps.sh
          (cd weizhi && ./scripts/build-android.sh arm64-v8a)
          test -f weizhi/android/weizhi/src/main/jniLibs/arm64-v8a/libweizhijni.so

      - name: Publish java-agent-core to local Maven
        run: ./java_agent/gradlew --no-daemon -p java_agent publishCoreToLocalRepo

      - name: Android JVM unit tests
        working-directory: android_agent
        env:
          DASHSCOPE_API_KEY: ""
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Assemble Debug APK (no API key baked in)
        working-directory: android_agent
        env:
          DASHSCOPE_API_KEY: ""
          # GITHUB_RUN_NUMBER 由 Actions 注入；Gradle 用于单调 versionCode（见 app/build.gradle.kts）
        run: |
          ./gradlew --no-daemon :app:assembleDebug
          unzip -p app/build/outputs/apk/debug/agent1-android-debug.apk META-INF/com/android/build/gradle/app-metadata.properties \
            | grep -E 'versionCode|versionName' || true
          if [ -d ../weizhi/android ]; then
            unzip -l app/build/outputs/apk/debug/agent1-android-debug.apk | grep 'lib/arm64-v8a/libweizhijni.so'
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent1-android-debug-apk
          path: android_agent/app/build/outputs/apk/debug/agent1-android-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Assemble Release APK (no API key baked in)
        run: chmod +x ./scripts/ci/assemble-android-release-apk.sh && ./scripts/ci/assemble-android-release-apk.sh

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent1-android-release-apk
          path: android_agent/app/build/outputs/apk/release/agent1-android-release.apk
          if-no-files-found: error
          retention-days: 14
