name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  java-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run Java unit tests
        run: ./java_agent/gradlew --no-daemon -p java_agent :core:test :cli:test
