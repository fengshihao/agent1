name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  smoke-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Compile source
        run: uv run python -m compileall src

      - name: Import smoke test
        run: uv run python -c "from agent1.tools.bash import run_bash; from agent1.tools.python import run_python; print('smoke-ok')"
