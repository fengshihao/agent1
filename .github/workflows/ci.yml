name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  java-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Weizhi source
        env:
          WEIZHI_GIT_URL: ${{ secrets.WEIZHI_GIT_URL }}
          WEIZHI_SKIP_SYNC: ${{ vars.WEIZHI_SKIP_SYNC }}
        run: chmod +x ./sync-weizhi.sh && ./sync-weizhi.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run tests (Weizhi optional)
        run: |
          set -euo pipefail
          WEIZHI_DIR="${GITHUB_WORKSPACE}/weizhi"
          if [ ! -d "${WEIZHI_DIR}/android" ] && [ -d "${GITHUB_WORKSPACE}/../weizhi/android" ]; then
            WEIZHI_DIR="${GITHUB_WORKSPACE}/../weizhi"
          fi
          if [ -d "${WEIZHI_DIR}" ] && [ -f "${WEIZHI_DIR}/scripts/test.sh" ]; then
            (cd "${WEIZHI_DIR}" && WEIZHI_SKIP_ASAN=1 ./scripts/test.sh)
            AGENT1_WEIZHI_REPO="${WEIZHI_DIR}" E2E_DEEPSEEK_V6_SKIP_LLM=1 ./scripts/e2e-deepseek-v6.sh
          else
            echo "skip weizhi: 未 clone weizhi（检查 sync-weizhi.sh 或设置 WEIZHI_SKIP_SYNC）— 仅 :core:test"
            ./java_agent/gradlew --no-daemon -p java_agent :core:test
          fi

  quality-static:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Java PMD + SpotBugs
        run: ./check-java-agent-static.sh

      - name: Android layering + main-thread gateway
        run: ./check-android-agent-static.sh

  android-assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Weizhi source
        env:
          WEIZHI_GIT_URL: ${{ secrets.WEIZHI_GIT_URL }}
          WEIZHI_SKIP_SYNC: ${{ vars.WEIZHI_SKIP_SYNC }}
        run: chmod +x ./sync-weizhi.sh && ./sync-weizhi.sh

      # 默认源码联编。备选预编译：Repository Variable WEIZHI_USE_PREBUILT=true + Secret WEIZHI_PREBUILT_URL（勿在 if 里引用 secret）
      - name: Import Weizhi prebuilt Maven (fallback)
        if: ${{ vars.WEIZHI_USE_PREBUILT == 'true' }}
        env:
          WEIZHI_PREBUILT_URL: ${{ secrets.WEIZHI_PREBUILT_URL }}
          WEIZHI_GITHUB_TOKEN: ${{ secrets.WEIZHI_GITHUB_TOKEN }}
        run: |
          if [ -z "${WEIZHI_PREBUILT_URL:-}" ]; then
            echo "WEIZHI_USE_PREBUILT=true 但未配置 WEIZHI_PREBUILT_URL，跳过预编译导入"
            exit 0
          fi
          chmod +x ./import-weizhi-prebuilt.sh && ./import-weizhi-prebuilt.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          if [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          else
            SDKM="${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager"
            echo "${ANDROID_HOME}/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          fi
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKM" --licenses >/dev/null
          "$SDKM" "platforms;android-34" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Build libweizhijni.so
        run: |
          if [ ! -d weizhi/android ]; then
            echo "未联编 weizhi 源码，跳过 native"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build
          chmod +x weizhi/scripts/build-android.sh weizhi/scripts/fetch-deps.sh
          (cd weizhi && ./scripts/build-android.sh arm64-v8a)
          test -f weizhi/android/weizhi/src/main/jniLibs/arm64-v8a/libweizhijni.so

      - name: Publish java-agent-core to local Maven
        run: ./java_agent/gradlew --no-daemon -p java_agent publishCoreToLocalRepo

      - name: Assemble Debug APK (no API key baked in)
        working-directory: android_agent
        env:
          DASHSCOPE_API_KEY: ""
        run: |
          ./gradlew --no-daemon :app:assembleAppDebug :app:assembleDiagnosticDebug
          if [ -d ../weizhi/android ]; then
            unzip -l app/build/outputs/apk/app/debug/agent1-android-app-debug.apk | grep 'lib/arm64-v8a/libweizhijni.so'
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent1-android-debug-apk
          path: android_agent/app/build/outputs/apk/app/debug/agent1-android-app-debug.apk

      - name: Upload diagnostic APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent1-android-diagnostic-apk
          path: android_agent/app/build/outputs/apk/diagnostic/debug/agent1-android-diagnostic-debug.apk
          if-no-files-found: error
          retention-days: 14
