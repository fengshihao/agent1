name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  java-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Weizhi native (optional)
        run: |
          if [ -d weizhi ]; then
            (cd weizhi && WEIZHI_SKIP_ASAN=1 ./scripts/test.sh)
          else
            echo "skip weizhi: checkout weizhi into ./weizhi to run JNI integration tests"
          fi

      - name: Run tests
        run: gradle -p java_agent :core:test :cli:test :weizhi-bridge:test
        env:
          AGENT1_WEIZHI_REPO: ${{ github.workspace }}/weizhi
