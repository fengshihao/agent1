name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  java-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run tests (Weizhi optional)
        run: |
          set -euo pipefail
          if [ -d weizhi ] && [ -f weizhi/scripts/test.sh ]; then
            (cd weizhi && WEIZHI_SKIP_ASAN=1 ./scripts/test.sh)
            ./java_agent/gradlew --no-daemon -p java_agent :core:test :cli:test :weizhi-bridge:test
          else
            echo "skip weizhi: no ./weizhi checkout — running core + cli tests only"
            ./java_agent/gradlew --no-daemon -p java_agent :core:test :cli:test
          fi
        env:
          AGENT1_WEIZHI_REPO: ${{ github.workspace }}/weizhi

  quality-static:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Java PMD + SpotBugs
        run: ./check-java-agent-static.sh

      - name: Android layering + main-thread gateway
        run: ./check-android-agent-static.sh

  android-assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          if [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          else
            SDKM="${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager"
            echo "${ANDROID_HOME}/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          fi
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKM" --licenses >/dev/null
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Publish java-agent-core to local Maven
        run: ./java_agent/gradlew --no-daemon -p java_agent publishCoreToLocalRepo

      - name: Assemble Debug APK (no API key baked in)
        working-directory: android_agent
        env:
          DASHSCOPE_API_KEY: ""
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-ui-demo-debug-apk
          path: android_agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
