name: Android Debug APK

# 云端/CI 编译 Debug APK 并上传 GitHub Artifacts，便于手机浏览器从 Actions 页下载。
# 刻意不在 workflow 中注入 DASHSCOPE_API_KEY（BuildConfig 中密钥为空，需本地自行配置后再编）。

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "android_agent/**"
      - "agent_core/**"
      - "java_agent/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android_agent/**"
      - "agent_core/**"
      - "java_agent/**"
      - ".github/workflows/android-apk.yml"

jobs:
  assemble-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Publish java-agent-core to local Maven
        run: ./java_agent/gradlew --no-daemon -p java_agent publishCoreToLocalRepo

      - name: Assemble Debug APK (no API key in package)
        working-directory: android_agent
        env:
          DASHSCOPE_API_KEY: ""
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-ui-demo-debug-apk
          path: android_agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
