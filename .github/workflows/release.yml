name: Release

on:
  push:
    branches: [master, main]
  schedule:
    # 每周一 14:00 UTC；自上次 v0.1.* 标签以来至少有 1 个新提交才发版
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "强制发版（忽略「每 N 个 commit」门槛；仍会做版本计算）"
        type: boolean
        default: false
      dry_run:
        description: "仅评估版本与门槛，不构建 APK、不创建 Release"
        type: boolean
        default: false

concurrency:
  group: agent1-github-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  # 仓库 Variables 可设 RELEASE_EVERY_N_COMMITS 覆盖默认 10
  RELEASE_EVERY_N_COMMITS: ${{ vars.RELEASE_EVERY_N_COMMITS || '10' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_release: ${{ steps.eval.outputs.should_release }}
      reason: ${{ steps.eval.outputs.reason }}
      commits_since_tag: ${{ steps.eval.outputs.commits_since_tag }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evaluate release trigger
        id: eval
        env:
          RELEASE_INPUT_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          RELEASE_INPUT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: chmod +x ./scripts/release/evaluate-release-trigger.sh && ./scripts/release/evaluate-release-trigger.sh

      - name: Compute version
        id: version
        if: >-
          steps.eval.outputs.should_release == 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: chmod +x ./scripts/release/compute-version.sh && ./scripts/release/compute-version.sh

      - name: Gate summary
        run: |
          echo "should_release=${{ steps.eval.outputs.should_release }}"
          echo "reason=${{ steps.eval.outputs.reason }}"
          echo "commits_since_tag=${{ steps.eval.outputs.commits_since_tag }}"
          echo "version=${{ steps.version.outputs.version_name }} tag=${{ steps.version.outputs.tag_name }}"

  build-and-publish:
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Weizhi source
        env:
          WEIZHI_GIT_URL: ${{ secrets.WEIZHI_GIT_URL }}
          WEIZHI_SKIP_SYNC: ${{ vars.WEIZHI_SKIP_SYNC }}
        run: chmod +x ./sync-weizhi.sh && ./sync-weizhi.sh

      - name: Import Weizhi prebuilt Maven (fallback)
        if: ${{ vars.WEIZHI_USE_PREBUILT == 'true' }}
        env:
          WEIZHI_PREBUILT_URL: ${{ secrets.WEIZHI_PREBUILT_URL }}
          WEIZHI_GITHUB_TOKEN: ${{ secrets.WEIZHI_GITHUB_TOKEN }}
        run: |
          if [ -z "${WEIZHI_PREBUILT_URL:-}" ]; then
            echo "WEIZHI_USE_PREBUILT=true 但未配置 WEIZHI_PREBUILT_URL，跳过预编译导入"
            exit 0
          fi
          chmod +x ./import-weizhi-prebuilt.sh && ./import-weizhi-prebuilt.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: chmod +x ./scripts/ci/install-android-sdk.sh && ./scripts/ci/install-android-sdk.sh

      - name: Build libweizhijni.so
        run: |
          if [ ! -d weizhi/android ]; then
            echo "未联编 weizhi 源码，跳过 native"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build
          chmod +x weizhi/scripts/build-android.sh weizhi/scripts/fetch-deps.sh
          (cd weizhi && ./scripts/build-android.sh arm64-v8a)
          test -f weizhi/android/weizhi/src/main/jniLibs/arm64-v8a/libweizhijni.so

      - name: Publish java-agent-core to local Maven
        run: ./java_agent/gradlew --no-daemon -p java_agent publishCoreToLocalRepo

      - name: Assemble Release APK (version aligned with tag)
        env:
          VERSION_NAME: ${{ needs.gate.outputs.version_name }}
          VERSION_CODE: ${{ needs.gate.outputs.version_code }}
        run: chmod +x ./scripts/ci/assemble-android-release-apk.sh && ./scripts/ci/assemble-android-release-apk.sh

      - name: Generate release notes
        id: notes
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x ./scripts/release/generate-release-notes.sh
          ./scripts/release/generate-release-notes.sh \
            "${{ needs.gate.outputs.version_name }}" \
            "${{ needs.gate.outputs.tag_name }}" \
            "${{ needs.gate.outputs.reason }}" > release-notes.md
          head -n 30 release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate.outputs.tag_name }}
          name: ${{ needs.gate.outputs.version_name }}
          body_path: release-notes.md
          files: android_agent/app/build/outputs/apk/release/agent1-android-release.apk
          generate_release_notes: false
          fail_on_unmatched_files: true
