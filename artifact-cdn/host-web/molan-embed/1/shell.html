<!DOCTYPE html>
<html lang="zh-CN" data-agent1-embed="1" class="agent1-boot">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>墨览 · 阅读</title>
  <meta name="theme-color" content="#1E2A24" />
  <meta name="color-scheme" content="dark light" />
  <script>
    (function () {
      var theme = "night";
      try {
        var t = localStorage.getItem("molan-theme");
        if (t === "night" || t === "hack" || t === "rose" || t === "xuan" || t === "slate" || t === "mist" || t === "cinnabar") theme = t;
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", theme);
      try {
        var ty = JSON.parse(localStorage.getItem("molan-type") || "null");
        if (ty && typeof ty === "object") {
          var s = document.documentElement.style;
          if (ty.size) s.setProperty("--reader-size", ty.size + "rem");
          if (ty.leading) s.setProperty("--reader-leading", String(ty.leading));
          if (ty.gap != null) s.setProperty("--reader-gap", ty.gap + "em");
          if (ty.tracking != null) s.setProperty("--reader-tracking", ty.tracking + "em");
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="__MOLAN_EMBED_BASE__vendor/vditor/dist/index.css" />
  <link rel="stylesheet" href="__MOLAN_EMBED_BASE__molan.css?v=__MOLAN_SHELL_V__" />
  <link rel="stylesheet" href="__MOLAN_EMBED_BASE__agent1-embed.css?v=__MOLAN_SHELL_V__" />
</head>
<body>
  <div class="app agent1-embed">
    <aside class="sidebar is-compact" hidden aria-hidden="true">
      <input class="search" id="searchInput" type="search" tabindex="-1" aria-hidden="true" />
      <button id="pickBtn" type="button" tabindex="-1" aria-hidden="true"></button>
      <div class="file-list" id="fileList" hidden></div>
    </aside>
    <main class="main">
      <header class="reader-header">
        <div class="reader-title">
          <h2 id="readerTitle">墨览</h2>
        </div>
        <div class="reader-actions">
          <button class="icon-btn molan-find-btn" id="molanFindBtn" type="button" hidden title="在文档中查找" aria-label="在文档中查找">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
              <path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="icon-btn" id="copyBtn" type="button" hidden title="复制原文" aria-label="复制原文">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2"/><rect x="4" y="8" width="12" height="12" rx="2"/></svg>
          </button>
          <div class="export-prefs" id="exportPrefs">
            <button class="icon-btn" id="pdfBtn" type="button" hidden title="导出" aria-label="导出">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 8H6.8A1.8 1.8 0 0 0 5 9.8v7.4A1.8 1.8 0 0 0 6.8 19h10.4a1.8 1.8 0 0 0 1.8-1.8V9.8A1.8 1.8 0 0 0 17.2 8H15"/><path d="M12 15V4"/><path d="M8.7 7.2 12 4l3.3 3.2"/></svg>
            </button>
            <div class="export-menu" id="exportMenu" hidden role="menu"></div>
          </div>
          <button class="icon-btn" id="reloadBtn" type="button" hidden tabindex="-1" aria-hidden="true"></button>
          <button class="icon-btn is-preview" id="modeBtn" type="button" hidden title="编辑" aria-label="编辑">
            <svg class="icon-edit" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>
            <svg class="icon-preview" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.8-7 9.5-7 9.5 7 9.5 7-3.8 7-9.5 7-9.5-7-9.5-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <button class="icon-btn" id="saveBtn" type="button" hidden disabled tabindex="-1" aria-hidden="true"></button>
          <div class="type-prefs" id="typePrefs">
            <button class="icon-btn" id="typeBtn" type="button" hidden title="排版" aria-label="排版">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 19L8.2 5.5h1.7L14.5 19"/><path d="M5.4 13.6h7.2"/><path d="M16.4 19l2.6-8h1.1L22.6 19"/><path d="M17.5 15.6h4.1"/></svg>
            </button>
          </div>
          <div class="header-prefs" id="headerPrefs">
            <button class="icon-btn" id="headerPrefsBtn" type="button" title="界面配置" aria-label="界面配置" aria-expanded="false" aria-haspopup="dialog" aria-controls="headerPrefsMenu">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 7.5h16M4 16.5h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <circle cx="9" cy="7.5" r="2.1" fill="currentColor"/>
                <circle cx="15" cy="16.5" r="2.1" fill="currentColor"/>
              </svg>
            </button>
            <div class="theme-menu" id="headerPrefsMenu" hidden role="dialog" aria-label="界面配置">
              <div class="type-head">纸面</div>
              <div class="theme-switch" id="themeSwitch" role="radiogroup" aria-label="界面样式">
                <button type="button" role="radio" data-theme="xuan" title="宣纸" aria-label="宣纸" aria-checked="false">
                  <svg viewBox="0 0 32 32" aria-hidden="true"><circle class="theme-ring" cx="16" cy="16" r="14.25"/><circle class="theme-fill" cx="16" cy="16" r="10"/></svg>
                </button>
                <button type="button" role="radio" data-theme="night" title="墨夜" aria-label="墨夜" aria-checked="true">
                  <svg viewBox="0 0 32 32" aria-hidden="true"><circle class="theme-ring" cx="16" cy="16" r="14.25"/><circle class="theme-fill" cx="16" cy="16" r="10"/></svg>
                </button>
                <button type="button" role="radio" data-theme="hack" title="终端" aria-label="终端" aria-checked="false">
                  <svg viewBox="0 0 32 32" aria-hidden="true"><circle class="theme-ring" cx="16" cy="16" r="14.25"/><circle class="theme-fill" cx="16" cy="16" r="10"/></svg>
                </button>
                <button type="button" role="radio" data-theme="rose" title="胭脂" aria-label="胭脂" aria-checked="false">
                  <svg viewBox="0 0 32 32" aria-hidden="true"><circle class="theme-ring" cx="16" cy="16" r="14.25"/><circle class="theme-fill" cx="16" cy="16" r="10"/></svg>
                </button>
                <button type="button" role="radio" data-theme="slate" title="青石" aria-label="青石" aria-checked="false">
                  <svg viewBox="0 0 32 32" aria-hidden="true"><circle class="theme-ring" cx="16" cy="16" r="14.25"/><circle class="theme-fill" cx="16" cy="16" r="10"/></svg>
                </button>
                <button type="button" role="radio" data-theme="mist" title="薄雾" aria-label="薄雾" aria-checked="false">
                  <svg viewBox="0 0 32 32" aria-hidden="true"><circle class="theme-ring" cx="16" cy="16" r="14.25"/><circle class="theme-fill" cx="16" cy="16" r="10"/></svg>
                </button>
                <button type="button" role="radio" data-theme="cinnabar" title="朱砂" aria-label="朱砂" aria-checked="false">
                  <svg viewBox="0 0 32 32" aria-hidden="true"><circle class="theme-ring" cx="16" cy="16" r="14.25"/><circle class="theme-fill" cx="16" cy="16" r="10"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </header>
      <div class="reader-body" id="readerBody">
        <section class="welcome" id="welcome" hidden></section>
        <div class="editor-wrap" id="editorWrap">
          <div class="molan-preview vditor-preview" id="molanPreview">
            <div class="vditor-reset" id="molanPreviewBody"></div>
          </div>
          <div id="vditor"></div>
        </div>
      </div>
      <footer class="status-bar">
        <span id="statusLeft"></span>
        <span id="statusRight"></span>
      </footer>
    </main>
  </div>
  <input class="hidden-input" id="dirInput" type="file" webkitdirectory directory multiple tabindex="-1" aria-hidden="true" hidden />
  <pre id="agent1MdError" hidden style="position:fixed;left:0;right:0;bottom:0;z-index:9999;margin:0;color:#b00020;background:#fff3f3;padding:12px;font:12px/1.5 sans-serif;white-space:pre-wrap;border-top:1px solid #b00020;"></pre>
  <script src="__MOLAN_EMBED_BASE__vendor/vditor/dist/method.min.js"></script>
  <script src="__MOLAN_EMBED_BASE__molan-i18n.js?v=__MOLAN_SHELL_V__"></script>
  <script src="__MOLAN_EMBED_BASE__molan-editor.js?v=__MOLAN_SHELL_V__"></script>
  <script src="__MOLAN_EMBED_BASE__molan-app.js?v=__MOLAN_SHELL_V__"></script>
  <script src="__MOLAN_EMBED_BASE__agent1-bridge.js?v=__MOLAN_SHELL_V__"></script>
</body>
</html>
