<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light only">
  <title>docx preview</title>
  <style>
    html, body { margin: 0; padding: 0; height: auto; min-height: 100%; background: #e8e8e8; overflow: visible; }
    /* height:100% 在 loadData 时父高为 0，会把 5000px 正文裁成顶部一条 */
    #docx-body { overflow: visible; height: auto; min-height: 100vh; padding: 0; box-sizing: border-box; }
    #docx-container { background: transparent; }
    #error {
      position: fixed; left: 0; right: 0; top: 0; z-index: 9999;
      color: #b00020; background: #fff3f3; padding: 16px; font-family: sans-serif;
      white-space: pre-wrap; border-bottom: 1px solid #b00020;
    }
  </style>
  <!-- baked at publish: pack-host-web.mjs -->
  <script src="__JSZIP_URL__"></script>
  <script src="__DOCX_PREVIEW_URL__"></script>
</head>
<body>
  <div id="docx-body"><div id="docx-container"></div></div>
  <pre id="error" hidden></pre>
  <script>
    (function () {
      function showError(msg) {
        var el = document.getElementById("error");
        el.hidden = false;
        el.textContent = msg;
      }
      var screenWidth = document.documentElement.clientWidth || window.innerWidth;
      function sniffImageDataUrl(src) {
        if (!src || src.indexOf("data:image/") === 0 || src.indexOf("data:") !== 0) return src;
        var comma = src.indexOf(",");
        if (comma < 0 || src.indexOf(";base64") < 0) return src;
        var mime = sniffMime(src.slice(comma + 1));
        if (!mime) return src;
        return "data:" + mime + ";base64," + src.slice(comma + 1);
      }
      function sniffMime(b64) {
        var sample = b64.slice(0, 80).replace(/\s/g, "");
        var head;
        try { head = atob(sample); } catch (e) { return null; }
        var b0 = head.charCodeAt(0);
        var b1 = head.charCodeAt(1);
        if (b0 === 0x89 && head.slice(1, 4) === "PNG") return "image/png";
        if (b0 === 0xff && b1 === 0xd8) return "image/jpeg";
        if (head.slice(0, 3) === "GIF") return "image/gif";
        if (head.slice(0, 4) === "RIFF" && head.slice(8, 12) === "WEBP") return "image/webp";
        var start = head.replace(/^\s+/, "");
        if (start.indexOf("<svg") === 0 || start.indexOf("<?xml") === 0) return "image/svg+xml";
        return null;
      }
      function retintImages(root) {
        var imgs = (root || document).querySelectorAll("img");
        for (var i = 0; i < imgs.length; i++) {
          var src = imgs[i].getAttribute("src") || "";
          var next = sniffImageDataUrl(src);
          if (next !== src) imgs[i].src = next;
        }
      }
      function pageSections(wrapper) {
        var pages = [];
        var kids = wrapper.children;
        for (var i = 0; i < kids.length; i++) {
          var el = kids[i];
          if (el.tagName === "SECTION" && el.classList.contains("docx")) pages.push(el);
        }
        return pages;
      }
      function showFloatingImages(root) {
        var boxes = root.querySelectorAll("div");
        for (var i = 0; i < boxes.length; i++) {
          var box = boxes[i];
          if (box.style.width !== "0px" || box.style.height !== "0px") continue;
          var img = box.querySelector("img");
          if (!img) continue;
          var w = img.style.width;
          var h = img.style.height;
          if (!w || w === "0px" || !h || h === "0px") continue;
          box.style.width = w;
          box.style.height = h;
          box.style.left = "0px";
          box.style.top = "0px";
          box.style.position = "relative";
          box.style.overflow = "visible";
          img.style.left = "0px";
          img.style.top = "0px";
        }
      }
      function fitPageToWidth() {
        var host = document.getElementById("docx-container");
        var wrapper = host && host.querySelector(".docx-wrapper");
        if (!host || !wrapper) return;
        var pages = pageSections(wrapper);
        if (!pages.length) return;
        var i;
        for (i = 0; i < pages.length; i++) pages[i].style.zoom = "";
        wrapper.style.zoom = "";
        wrapper.style.transform = "none";
        wrapper.style.alignItems = "flex-start";
        wrapper.style.padding = "0";
        wrapper.style.background = "#fff";
        var pageWidth = pages[0].offsetWidth;
        var contentHeight = wrapper.offsetHeight;
        var avail = screenWidth;
        if (!avail || avail < 50) {
          avail = window.innerWidth || document.documentElement.clientWidth;
        }
        if (!pageWidth || !contentHeight || !avail) return;
        var scale = Math.min(1, avail / pageWidth);
        wrapper.style.width = pageWidth + "px";
        wrapper.style.transformOrigin = "top left";
        wrapper.style.transform = "scale(" + scale + ")";
        host.style.width = "100%";
        host.style.height = Math.ceil(contentHeight * scale) + "px";
        host.style.overflow = "hidden";
        document.body.style.overflowX = "hidden";
      }
      async function renderFromBase64(b64) {
        var errEl = document.getElementById("error");
        errEl.hidden = true;
        try {
          var before = document.documentElement.clientWidth || window.innerWidth;
          if (before > 50) screenWidth = before;
          if (typeof docx === "undefined" || !docx.renderAsync) {
            showError("docx-preview 未加载，请检查网络或 CDN");
            return;
          }
          var binary = atob(b64);
          var len = binary.length;
          var bytes = new Uint8Array(len);
          for (var i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
          var body = document.getElementById("docx-container");
          body.innerHTML = "";
          await docx.renderAsync(bytes, body, body, {
            className: "docx",
            inWrapper: true,
            breakPages: true,
            renderHeaders: true,
            renderFooters: true,
            ignoreLastRenderedPageBreak: false,
            useBase64URL: true,
          });
          document.documentElement.style.height = "auto";
          document.body.style.height = "auto";
          document.body.style.overflow = "visible";
          retintImages(body);
          showFloatingImages(body);
          if (window.__agent1DocxAfterRender) {
            window.__agent1DocxAfterRender();
          }
          fitPageToWidth();
        } catch (e) {
          showError(String(e && e.message ? e.message : e));
        }
      }
      function docxBridge() {
        try {
          if (window.Agent1Docx) return window.Agent1Docx;
          if (typeof Agent1Docx !== "undefined") return Agent1Docx;
        } catch (e) { /* ignore */ }
        return null;
      }
      window.__agent1DocxBoot = function () {
        function attempt(n) {
          if (typeof docx === "undefined" || !docx.renderAsync) {
            if (n < 80) { setTimeout(function () { attempt(n + 1); }, 50); return; }
            showError("docx-preview 未加载，请检查网络或 CDN");
            return;
          }
          var b = docxBridge();
          if (!b || typeof b.readDocxBase64 !== "function") {
            if (n < 80) { setTimeout(function () { attempt(n + 1); }, 50); return; }
            showError("预览桥未就绪");
            return;
          }
          try {
            var b64 = b.readDocxBase64();
            if (!b64) { showError("无法读取文档"); return; }
            renderFromBase64(b64);
          } catch (e) {
            showError(String(e && e.message ? e.message : e));
          }
        }
        attempt(0);
      };
      window.__agent1DocxFit = fitPageToWidth;
      window.addEventListener("resize", function () {
        screenWidth = window.visualViewport && window.visualViewport.width
          ? window.visualViewport.width
          : screenWidth;
        fitPageToWidth();
      });
      window.__agent1DocxRender = renderFromBase64;
      function scheduleBoot() {
        if (window.__agent1DocxBoot) window.__agent1DocxBoot();
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", scheduleBoot);
      } else {
        scheduleBoot();
      }
    })();
  </script>
</body>
</html>
