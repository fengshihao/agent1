<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>伊犁草原环线 · 八日自驾</title>
<style>
  :root {
    --ink: #17211c;
    --muted: #5d6a62;
    --paper: #f3eee4;
    --card: #fffdf8;
    --lake: #1d5f73;
    --gold: #b67832;
    --line: rgba(23, 33, 28, .08);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "PingFang SC", "HarmonyOS Sans", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
  }
  button, a { font-family: inherit; }
  img { max-width: 100%; }
  .hero {
    position: relative;
    height: 100svh;
    min-height: 640px;
    overflow: hidden;
    background: #10211c;
    color: #f7f2e8;
  }
  .hero img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 42%;
    transform: scale(1.04);
    animation: drift 22s ease-in-out alternate infinite;
  }
  @keyframes drift {
    to { transform: scale(1.1) translate3d(-1.2%, -1%, 0); }
  }
  .hero-shade {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to top, rgba(7, 14, 12, .88) 0%, rgba(7, 14, 12, .42) 38%, rgba(7, 14, 12, .18) 100%);
  }
  .hero-copy {
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: min(920px, 100%);
    padding: 0 18px 22px;
  }
  .kicker {
    margin: 0 0 10px;
    font-size: 12px;
    letter-spacing: .34em;
    text-indent: .34em;
    opacity: .86;
  }
  .hero h1 {
    margin: 0;
    font-family: "Songti SC", "STSong", "Noto Serif SC", "PingFang SC", serif;
    font-size: clamp(46px, 12vw, 84px);
    font-weight: 600;
    line-height: .95;
    letter-spacing: .04em;
  }
  .hero .sub {
    max-width: 28em;
    margin: 14px 0 0;
    font-size: 15px;
    line-height: 1.65;
    color: rgba(247, 242, 232, .9);
  }
  .hero-place {
    position: absolute;
    top: 18px;
    left: 18px;
    z-index: 1;
    margin: 0;
    padding: 6px 10px;
    border-radius: 999px;
    background: rgba(10, 16, 14, .38);
    backdrop-filter: blur(8px);
    font-size: 12px;
    letter-spacing: .08em;
  }
  .wrap { width: min(920px, calc(100% - 28px)); margin: 0 auto; }
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 16px;
  }
  .stat {
    background: rgba(255, 252, 247, .14);
    border: 1px solid rgba(255, 255, 255, .22);
    border-radius: 16px;
    padding: 10px 12px;
    text-align: left;
    backdrop-filter: blur(10px);
  }
  .stat b {
    display: block;
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: .02em;
    color: #fff;
  }
  .stat span { display: block; margin-top: 2px; color: rgba(247, 242, 232, .78); font-size: 12px; }
  .block { margin-top: 28px; }
  .block h2 {
    margin: 0 0 4px;
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    font-size: 28px;
    font-weight: 600;
  }
  .lead { margin: 0 0 12px; color: var(--muted); font-size: 13.5px; }
  .map-frame {
    position: relative;
    height: min(78vw, 520px);
    min-height: 340px;
    border-radius: 24px;
    overflow: hidden;
    background: #d5e3da;
    box-shadow: 0 16px 40px rgba(20, 33, 28, .08);
  }
  .map-frame, #map { touch-action: none; }
  #map { width: 100%; height: 100%; display: block; cursor: grab; }
  #map.dragging { cursor: grabbing; }
  .rose {
    position: absolute; right: 14px; bottom: 14px; z-index: 2;
    width: 58px; height: 62px; pointer-events: none;
    filter: drop-shadow(0 2px 6px rgba(20, 33, 28, .18));
  }
  .rose svg { display: block; }
  .labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .mlabel {
    position: absolute;
    font-size: 12px;
    font-weight: 650;
    color: #1d332b;
    white-space: nowrap;
    padding: 3px 9px;
    border-radius: 999px;
    background: rgba(253, 251, 244, .92);
    border: 1px solid rgba(29, 51, 43, .10);
    box-shadow: 0 1px 5px rgba(20, 33, 28, .16);
  }
  .mlabel.on {
    background: #1d332b;
    color: #f9f6ec;
    font-weight: 750;
    border-color: transparent;
  }
  .mkm {
    font-size: 10.5px;
    font-weight: 750;
    color: #fff;
    padding: 2.5px 8px;
    border-radius: 999px;
    box-shadow: 0 2px 5px rgba(20, 33, 28, .22);
    letter-spacing: .02em;
  }
  .leg-flow {
    fill: none;
    stroke: rgba(255, 255, 255, .65);
    stroke-width: 2.6;
    stroke-linecap: round;
    stroke-dasharray: 3 18;
    animation: legFlow 1.1s linear infinite;
  }
  @keyframes legFlow { to { stroke-dashoffset: -21; } }
  @media (prefers-reduced-motion: reduce) { .leg-flow { animation: none; opacity: 0; } }
  .zoom {
    display: flex;
    flex-direction: row;
    justify-content: flex-end;
    gap: 6px;
    margin-top: 8px;
  }
  .zoom button {
    width: 36px;
    height: 36px;
    border: 0;
    border-radius: 11px;
    background: #fffdf8;
    color: var(--ink);
    font-size: 18px;
    line-height: 1;
    box-shadow: 0 4px 14px rgba(20, 33, 28, .08);
  }
  .zoom button.wide {
    width: auto;
    padding: 0 12px;
    font-size: 12px;
    letter-spacing: .08em;
  }
  .rail {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin: 22px -14px 0;
    padding: 10px 14px;
    background: rgba(243, 238, 228, .92);
    backdrop-filter: blur(12px);
    scrollbar-width: none;
  }
  .rail::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid transparent;
    background: var(--card);
    border-radius: 999px;
    padding: 4px 12px 4px 4px;
    color: var(--ink);
    box-shadow: 0 1px 0 var(--line);
  }
  .chip img, .chip i {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
    background: #d5e3da;
    display: block;
  }
  .chip i { font-style: normal; display: grid; place-items: center; color: #f7f2e8; background: #1d4f48; font-size: 12px; }
  .chip b { display: block; font-size: 13px; line-height: 1.15; }
  .chip small { display: block; color: var(--muted); font-size: 11px; }
  .chip.on { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(182, 120, 50, .25); }
  #day { scroll-margin-top: 78px; }
  .day-layout { margin-top: 8px; }
  .frame {
    position: relative;
    border-radius: 22px;
    overflow: hidden;
    background: #d7d1c4;
    aspect-ratio: 16 / 10;
  }
  .frame img { width: 100%; height: 100%; object-fit: cover; object-position: center 36%; display: block; }
  .cap {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    margin: 0;
    padding: 36px 14px 12px;
    background: linear-gradient(transparent, rgba(0, 0, 0, .62));
    color: white;
    font-size: 13px;
  }
  .quiet {
    display: flex;
    align-items: flex-end;
    background:
      radial-gradient(90% 80% at 100% 0%, rgba(232, 176, 92, .9), transparent 55%),
      linear-gradient(155deg, #14352f, #1c4f48 48%, #245f73);
    color: #f6f1e7;
  }
  .quiet p {
    margin: 0;
    padding: 22px;
    max-width: 14em;
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    font-size: 24px;
    line-height: 1.35;
  }
  .arr, .dots { position: absolute; z-index: 1; }
  .arr {
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    border: 0;
    border-radius: 50%;
    background: rgba(255, 253, 248, .9);
    color: var(--ink);
    font-size: 22px;
    line-height: 1;
  }
  .arr.prev { left: 10px; }
  .arr.next { right: 10px; }
  .dots { left: 0; right: 0; bottom: 36px; display: flex; justify-content: center; gap: 6px; }
  .dots button {
    width: 7px; height: 7px; border: 0; border-radius: 50%;
    background: rgba(255, 255, 255, .5); padding: 0;
  }
  .dots button.on { background: white; transform: scale(1.25); }
  .day-copy h3 {
    margin: 14px 0 4px;
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    font-size: 26px;
    font-weight: 600;
    line-height: 1.25;
  }
  .theme { margin: 0; color: var(--gold); font-size: 14px; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .meta span {
    background: #efe8da;
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 12.5px;
  }
  .via { margin: 0 0 8px; color: var(--muted); font-size: 13.5px; }
  .tl { list-style: none; margin: 8px 0 0; padding: 0; }
  .tl li {
    display: grid;
    grid-template-columns: 58px 1fr;
    gap: 10px;
    padding: 9px 0;
  }
  .tl div { line-height: 1.55; }
  .tl time { color: var(--gold); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 13px; }
  .pair { display: grid; gap: 8px; margin-top: 12px; }
  .pair div { background: var(--card); border-radius: 16px; padding: 12px 14px; }
  .pair h4 { margin: 0 0 4px; font-size: 12px; letter-spacing: .16em; color: var(--lake); }
  .pair p { margin: 0; font-size: 14px; }
  .tips { margin: 12px 0 0; padding-left: 18px; color: #2c3a34; font-size: 14px; }
  .tips li { margin: 4px 0; }
  .toc {
    position: sticky; top: 0; z-index: 6;
    display: flex; gap: 8px;
    margin: 18px -14px 0; padding: 10px 14px;
    background: rgba(243, 238, 228, .94);
    backdrop-filter: blur(12px);
  }
  .toc a {
    flex: 1; text-align: center; text-decoration: none;
    color: var(--ink); background: var(--card);
    border-radius: 999px; padding: 8px 0; font-size: 13px; font-weight: 650;
  }
  .toc a.on { background: #14241e; color: #f6f1e7; }
  #sec-route, #sec-days, #sec-money, #sec-pack { scroll-margin-top: 58px; }
  .legend { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
  .legend i {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px;
    box-shadow: 0 0 0 3px rgba(29,51,43,.06);
  }
  .legend button {
    display: inline-flex; align-items: center;
    border: 1px solid rgba(29,51,43,.09);
    background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 6px 12px;
    font-size: 12px; font-weight: 650;
  }
  .legend button.on { background: #1d332b; color: #f6f1e7; border-color: transparent; }
  .day-layout { animation: dayIn .46s cubic-bezier(.2,.7,.2,1); }
  @keyframes dayIn { from { opacity: 0; transform: translateX(36px); } to { opacity: 1; transform: none; } }
  #pic { transition: opacity .5s ease, transform .65s cubic-bezier(.22,.8,.28,1); }
  #pic.swap { opacity: 0; transform: scale(1.05) translateX(22px); }
  .gos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
  .go {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 48px;
    border-radius: 999px;
    background: #14241e;
    color: #f6f1e7;
    text-decoration: none;
    font-weight: 650;
    letter-spacing: .04em;
  }
  .go.baidu { background: #2b4c8a; }
  .pack { display: grid; gap: 8px; }
  .pack label {
    display: flex; gap: 10px; align-items: flex-start;
    background: var(--card); border-radius: 16px; padding: 12px 14px;
  }
  .pack input { width: 18px; height: 18px; margin-top: 3px; flex: 0 0 auto; }
  .pack small { display: block; color: var(--gold); font-size: 11px; letter-spacing: .14em; }
  .pack span { font-size: 14px; }
  .pack label.done span { color: var(--muted); text-decoration: line-through; }
  @media (prefers-reduced-motion: reduce) {
    .day-layout, #pic { animation: none; transition: none; }
  }
  .money, .note-list { display: grid; gap: 8px; }
  .row, .ticket {
    background: var(--card);
    border-radius: 16px;
    padding: 12px 14px;
  }
  .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .row b { font-weight: 600; }
  .row span, .ticket .price { color: #2a3b34; }
  .row em { font-style: normal; color: var(--muted); font-size: 12px; }
  .row.sum { background: #14241e; color: #f6f1e7; }
  .row.sum span, .row.sum em { color: rgba(246, 241, 231, .78); }
  .ticket h3 { margin: 0 0 4px; font-size: 16px; }
  .ticket .price { margin: 0; font-size: 14px; }
  .ticket .note { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; }
  .notes { margin: 0; padding-left: 18px; }
  .notes li { margin: 6px 0; }
  footer {
    margin: 28px 0 48px;
    color: #8b9188;
    font-size: 12px;
    line-height: 1.7;
  }
  .lightbox[hidden] { display: none !important; }
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 24px 16px 32px;
    background: rgba(8, 12, 11, .92);
  }
  .lightbox img { max-width: 100%; max-height: 78vh; object-fit: contain; border-radius: 12px; }
  .lightbox p { margin: 0; color: #f3ecdf; font-size: 14px; text-align: center; }
  .lb-x {
    position: absolute;
    top: 16px;
    right: 16px;
    border: 0;
    background: transparent;
    color: white;
    font-size: 15px;
  }
  @media (min-width: 720px) {
    .stats { grid-template-columns: repeat(4, 1fr); }
  }
  @media (min-width: 900px) {
    .day-layout { display: grid; grid-template-columns: 1.15fr .85fr; gap: 26px; align-items: start; }
    .frame { position: sticky; top: 84px; }
    .pair { grid-template-columns: 1fr 1fr; }
    .money, .note-list.tickets { grid-template-columns: 1fr 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hero img { animation: none; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<header class="hero">
  <img id="heroImg" alt="">
  <div class="hero-shade"></div>
  <p class="hero-place" id="heroPlace"></p>
  <div class="hero-copy">
    <p class="kicker" id="kicker"></p>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
    <section class="stats" id="stats"></section>
  </div>
</header>

<div class="wrap">
  <nav class="toc" id="toc">
    <a href="#sec-route">路线</a>
    <a href="#sec-days">日程</a>
    <a href="#sec-money">花费</a>
    <a href="#sec-pack">清单</a>
  </nav>

  <section class="block" id="sec-route">
    <h2>这一路</h2>
    <p class="lead" id="mapHint">北在上方。每天一种颜色，曲线上标了公里。单指拖动，双指缩放。</p>
    <div class="map-frame" id="frame">
      <svg id="map" role="img" aria-label="伊犁八日自驾路线图"></svg>
      <div class="labels" id="labels"></div>
      <div class="rose" aria-hidden="true"><svg viewBox="0 0 64 68" width="58" height="62">
        <text x="32" y="8" text-anchor="middle" font-size="9.5" font-weight="800" fill="#1d332b">北</text>
        <circle cx="32" cy="39" r="20" fill="rgba(253,251,244,.9)" stroke="rgba(29,51,43,.18)" stroke-width="1"/>
        <circle cx="32" cy="39" r="15.5" fill="none" stroke="rgba(29,51,43,.09)" stroke-width="1"/>
        <path d="M32 39 L50 36.2 L33 41 Z M32 39 L14 36.2 L31 41 Z" fill="rgba(29,51,43,.28)"/>
        <path d="M32 39 L32 63 L28 42 Z" fill="rgba(29,51,43,.28)"/>
        <path d="M32 22 L36 39 L32 36.5 Z" fill="#b0543a"/>
        <path d="M32 22 L28 39 L32 36.5 Z" fill="#8a3f2b"/>
        <text x="55" y="41.5" text-anchor="middle" font-size="7" font-weight="700" fill="#41564d">东</text>
        <text x="32" y="66.5" text-anchor="middle" font-size="7" font-weight="700" fill="#41564d">南</text>
        <text x="9" y="41.5" text-anchor="middle" font-size="7" font-weight="700" fill="#41564d">西</text>
      </svg></div>
    </div>
    <div class="zoom">
      <button type="button" id="zin" aria-label="放大">+</button>
      <button type="button" id="zout" aria-label="缩小">−</button>
      <button type="button" id="zall" class="wide" aria-label="看完全程">全程</button>
    </div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="block" id="sec-days">
    <h2>日程</h2>
    <nav class="rail" id="rail" aria-label="八天"></nav>
    <article id="day"></article>
  </section>

  <section class="block" id="sec-money">
    <h2>钱怎么花</h2>
    <p class="lead">两人合计。门票按 2025–2026 年公开价格，出发前再对一次。</p>
    <div class="money" id="budget"></div>
    <h2 style="margin-top:22px">门票和区间车</h2>
    <div class="note-list tickets" id="tickets"></div>
  </section>

  <section class="block" id="sec-pack">
    <h2>出发前</h2>
    <p class="lead">勾过的会留在这台手机上。</p>
    <div class="pack" id="pack"></div>
    <ul class="notes" id="notes" style="margin-top:14px"></ul>
  </section>

  <footer id="foot"></footer>
</div>

<div class="lightbox" id="lightbox" hidden>
  <button type="button" class="lb-x" id="lbx">关闭</button>
  <img id="lbimg" alt="">
  <p id="lbcap"></p>
</div>

function zoomFrom(base, ux, uy, factor) {

      x: from.x + (target.x - from.x) * e,
      y: from.y + (target.y - from.y) * e,

function dayView(i) {

  pts.forEach((p) => {
    minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
    minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
  });
  let w = Math.max(120, maxX - minX);
  let h = Math.max(90, maxY - minY);
  const padX = w * 0.55 + 70;
  const padY = h * 0.7 + 60;

  let y = minY - padY;
  w += padX * 2;
  h += padY * 2;

    x -= (nw - w) / 2;
    w = nw;
  } else {
    const nh = w / aspect;
    y -= (nh - h) / 2;
    h = nh;
  }

        '<div class="dots">' + imgs.map((_, n) => '<button type="button" data-n="' + n + '"' + (n === 0 ? ' class="on"' : '') + ' aria-label="第' + (n + 1) + '张"></button>').join("") + '</div>'
      : "";
    frameHtml = '<div class="frame" id="framePic">' +
      '<img id="pic" alt="' + esc(imgs[0].caption || "") + '" src="' + esc(imgs[0].path) + '">' +
      '<p class="cap" id="picCap">' + esc(imgs[0].caption || "") + '</p>' + arrows + '</div>';
  }
  const via = (day.waypoints || []).map((p) => shortName(p.name)).join(" → ");
  const tl = (day.schedule || []).map((item) =>
    '<li><time>' + esc(item.time) + '</time><div>' + esc(item.text) + '</div></li>'
  ).join("");
  const tips = (day.tips || []).map((t) => '<li>' + esc(t) + '</li>').join("");
  root.innerHTML =
    '<div class="day-layout">' + frameHtml +
    '<div class="day-copy"><h3>' + esc(day.title) + '</h3><p class="theme">' + esc(day.theme || "") + '</p>' +
    '<div class="meta"><span>' + esc(String(day.km)) + ' 公里</span><span>车程 ' + esc(day.hours || "") + '</span></div>' +
    '<p class="via">' + esc(via) + '</p><ul class="tl">' + tl + '</ul>' +
    '<div class="pair"><div><h4>住</h4><p>' + esc(day.stay || "") + '</p></div><div><h4>吃</h4><p>' + esc(day.food || "") + '</p></div></div>' +
    (tips ? '<ul class="tips">' + tips + '</ul>' : '') +
    '</div></div>';
  if ((day.waypoints || []).length >= 2) {
    const row = document.createElement("div");
    row.className = "gos";
    [["高德导航", appRouteUri(day.waypoints), "amap"], ["百度导航", baiduRouteUri(day.waypoints), "baidu"]].forEach((item) => {
      const a = document.createElement("a");
      a.className = "go " + item[2];
      a.href = item[1];
      a.textContent = item[0];
      row.appendChild(a);
    });
    root.querySelector(".day-copy").appendChild(row);
  }
  bindGallery(imgs);
}

function showPhoto(imgs) {
  const img = document.getElementById("pic");
  const cap = document.getElementById("picCap");
  if (!img || !imgs[photo]) return;
  img.classList.add("swap");
  window.setTimeout(() => {
    img.src = imgs[photo].path;
    img.alt = imgs[photo].caption || "";
    if (cap) cap.textContent = imgs[photo].caption || "";
    requestAnimationFrame(() => img.classList.remove("swap"));
  }, 180);
  document.querySelectorAll(".dots button").forEach((btn, n) => btn.classList.toggle("on", n === photo));
}
function bindGallery(imgs) {
  const pic = document.getElementById("pic");
  if (!pic || imgs.length < 1) return;
  let startX = 0;
  let startY = 0;
  pic.addEventListener("click", () => {
    if (suppressClick) { suppressClick = false; return; }
    openLight(imgs[photo]);
  });
  const box = document.getElementById("framePic");
  box.addEventListener("touchstart", (e) => {
    if (e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });
  box.addEventListener("touchend", (e) => {
    const t = e.changedTouches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    if (Math.abs(dx) < 36 || Math.abs(dx) < Math.abs(dy)) return;
    suppressClick = true;
    photo = (photo + (dx < 0 ? 1 : imgs.length - 1)) % imgs.length;
    showPhoto(imgs);
  });
  box.querySelectorAll(".arr").forEach((btn) => btn.addEventListener("click", (e) => {
    e.stopPropagation();
    const dir = Number(btn.dataset.dir);
    photo = (photo + dir + imgs.length) % imgs.length;
    showPhoto(imgs);
  }));
  box.querySelectorAll(".dots button").forEach((btn) => btn.addEventListener("click", (e) => {
    e.stopPropagation();
    photo = Number(btn.dataset.n);
    showPhoto(imgs);
  }));
}
function openLight(img) {
  const box = document.getElementById("lightbox");
  document.getElementById("lbimg").src = img.path;
  document.getElementById("lbimg").alt = img.caption || "";
  document.getElementById("lbcap").textContent = img.caption || "";
  box.hidden = false;
}
function closeLight() { document.getElementById("lightbox").hidden = true; }

function selectDay(i, source) {
  active = i;
  isolate = true;
  document.querySelectorAll(".chip").forEach((btn) => btn.classList.toggle("on", Number(btn.dataset.i) === i));
  const on = document.querySelector('.chip[data-i="' + i + '"]');
  if (on && source !== "init") on.scrollIntoView({ inline: "center", block: "nearest" });
  renderDay(i);
  paint();
  const day = TRIP.days[i];
  const hint = (day.date || "") + " · " + shortName(day.waypoints[0].name) + " → " + endName(day) + " · " + day.km + " 公里";
  document.querySelectorAll(".legend button").forEach((btn) => btn.classList.toggle("on", Number(btn.dataset.i) === i));
  if (source === "init") {
    document.getElementById("mapHint").textContent = "北在上方。每天一种颜色，曲线旁是公里。单指拖动，双指缩放。";
  } else {
    document.getElementById("mapHint").textContent = "正在看 " + hint;
    animateTo(dayView(i));
  }
  if (source === "map" || source === "legend") {
    document.getElementById("sec-days").scrollIntoView({ behavior: "smooth", block: "start" });
  }
}

document.getElementById("rail").addEventListener("click", (e) => {
  const btn = e.target.closest(".chip");
  if (!btn) return;
  selectDay(Number(btn.dataset.i), "rail");
});
document.getElementById("zin").addEventListener("click", () => {
  cancelAnimationFrame(anim);
  zoomFrom(vb, vb.x + vb.w / 2, vb.y + vb.h / 2, 0.78);
});
document.getElementById("zout").addEventListener("click", () => {
  cancelAnimationFrame(anim);
  zoomFrom(vb, vb.x + vb.w / 2, vb.y + vb.h / 2, 1.28);
});
document.getElementById("zall").addEventListener("click", () => {
  isolate = false;
  paint();
  animateTo({ x: 0, y: 0, w: VIEW_W, h: VIEW_H });
  document.getElementById("mapHint").textContent = "全程 " + TRIP.trip.totalKm + " 公里。点图例或某一天，只看那天的曲线。";
});
document.getElementById("legend").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  selectDay(Number(btn.dataset.i), "legend");
});
document.getElementById("lbx").addEventListener("click", closeLight);
document.getElementById("lightbox").addEventListener("click", (e) => {
  if (e.target.id === "lightbox" || e.target.id === "lbx") closeLight();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeLight();
  if (e.key === "ArrowRight") selectDay(Math.min(TRIP.days.length - 1, active + 1), "key");
  if (e.key === "ArrowLeft") selectDay(Math.max(0, active - 1), "key");
});

svg.addEventListener("wheel", (e) => {
  e.preventDefault();
  cancelAnimationFrame(anim);
  const u = toUser(e.clientX, e.clientY);
  if (!u) return;
  zoomFrom(vb, u.x, u.y, e.deltaY > 0 ? 1.12 : 0.9);
}, { passive: false });

let drag = null;
let dragMoved = false;
let pinch = null;
const ptrs = new Map();
function endPtr(e) {
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 0) {
    drag = null;
    svg.classList.remove("dragging");
  } else if (ptrs.size === 1) {
    const left = [...ptrs.values()][0];
    const ctm = svg.getScreenCTM();
    drag = { x: left.x, y: left.y, vb: { ...vb }, sx: ctm ? ctm.a : 1, sy: ctm ? ctm.d : 1 };
  }
}
svg.addEventListener("pointerdown", (e) => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  try { svg.setPointerCapture(e.pointerId); } catch (err) {}
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  cancelAnimationFrame(anim);
  if (ptrs.size >= 2) {
    drag = null;
    const arr = [...ptrs.values()];
    const mid = { x: (arr[0].x + arr[1].x) / 2, y: (arr[0].y + arr[1].y) / 2 };
    const u = toUser(mid.x, mid.y);
    pinch = {
      dist: Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y),
      vb: { ...vb },
      ux: u ? u.x : vb.x + vb.w / 2,
      uy: u ? u.y : vb.y + vb.h / 2
    };
    return;
  }
  const ctm = svg.getScreenCTM();
  drag = { x: e.clientX, y: e.clientY, vb: { ...vb }, sx: ctm ? ctm.a : 1, sy: ctm ? ctm.d : 1 };
  dragMoved = false;
  svg.classList.add("dragging");
});
svg.addEventListener("pointermove", (e) => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size >= 2 && pinch) {
    const arr = [...ptrs.values()];
    const dist = Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y);
    if (pinch.dist > 0 && dist > 0) zoomFrom(pinch.vb, pinch.ux, pinch.uy, pinch.dist / dist);
    return;
  }
  if (!drag) return;
  if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 5) dragMoved = true;
  vb = {
    x: drag.vb.x - (e.clientX - drag.x) / drag.sx,
    y: drag.vb.y - (e.clientY - drag.y) / drag.sy,
    w: drag.vb.w,
    h: drag.vb.h
  };
  apply();
});
svg.addEventListener("pointerup", endPtr);
svg.addEventListener("pointercancel", endPtr);
svg.addEventListener("click", (e) => {
  if (dragMoved) { dragMoved = false; return; }
  const rect = frame.getBoundingClientRect();
  let best = -1;
  let bestD = 26;
  places.forEach((p, i) => {
    const s = toScreen(p.x, p.y);
    if (!s) return;
    const d = Math.hypot(s.x - (e.clientX - rect.left), s.y - (e.clientY - rect.top));
    if (d < bestD) { bestD = d; best = i; }
  });
  if (best >= 0) selectDay(places[best].days[0], "map");
});

const PACK = [
  ["证件", "身份证、驾驶证随身。还车时对一下行驶证和加油小票。"],
  ["先订", "那拉提、巴音布鲁克的住宿提前 3–4 周。那拉提自驾名额提前 7 天在公众号抢。"],
  ["路况", "出发前看「平安独库」和新疆交警。伊昭公路遇雨可能临时管制。"],
  ["衣物", "防晒帽、墨镜、防晒霜，再加一件抓绒或薄羽绒、一件雨衣。巴音布鲁克日落只有几度。"],
  ["车上", "备胎、灭火器、充电线、离线地图。油量低于半箱就加。"],
  ["药品", "肠胃药、晕车药、创可贴。"],
  ["进景区", "景区和加油站可能要看身份证。液体伴手礼留意返程托运。"]
];
const PACK_KEY = "agent1-pack-xinjiang-yili-8d";
function renderPack() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(PACK_KEY) || "{}"); } catch (e) {}
  document.getElementById("pack").innerHTML = PACK.map((row, i) =>
    '<label class="' + (saved[i] ? "done" : "") + '"><input type="checkbox" data-i="' + i + '"' +
    (saved[i] ? " checked" : "") + '><div><small>' + esc(row[0]) + '</small><span>' + esc(row[1]) + '</span></div></label>'
  ).join("");
}
document.getElementById("pack").addEventListener("change", (e) => {
  if (e.target.type !== "checkbox") return;
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(PACK_KEY) || "{}"); } catch (err) {}
  saved[e.target.dataset.i] = e.target.checked;
  localStorage.setItem(PACK_KEY, JSON.stringify(saved));
  e.target.closest("label").classList.toggle("done", e.target.checked);
});

renderShell();
drawMap();
selectDay(0, "init");
window.addEventListener("resize", () => placeLabels());
const tocLinks = [...document.querySelectorAll("#toc a")];
function markToc() {
  let current = tocLinks[0];
  tocLinks.forEach((a) => {
    const sec = document.querySelector(a.getAttribute("href"));
    if (sec && sec.getBoundingClientRect().top < 96) current = a;
  });
  tocLinks.forEach((a) => a.classList.toggle("on", a === current));
}
window.addEventListener("scroll", markToc, { passive: true });
markToc();
