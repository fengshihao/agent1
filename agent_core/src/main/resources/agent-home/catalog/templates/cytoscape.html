<!DOCTYPE html>
<html lang='zh-CN'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>

</head>
<body>
<div id='cy' style='width:640px;height:360px'></div>
<script src='https://cdn.jsdelivr.net/npm/cytoscape@3.30.4/dist/cytoscape.min.js'></script>
<script>
cytoscape({container:document.getElementById('cy'), elements:[{data:{id:'a'}},{data:{id:'b'}},{data:{id:'ab', source:'a', target:'b'}}], style:[{selector:'node', style:{'label':'data(id)'}}]});
</script>
</body>
</html>
